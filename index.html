<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chat Chung + Bot Nối Từ</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#0a0e17;
    --panel:#111826;
    --panel2:#161f2e;
    --border:#233047;
    --neon:#00e5ff;
    --neon2:#7c4dff;
    --text:#e6f1ff;
    --muted:#7d8aa3;
    --danger:#ff4d6d;
    --success:#00e676;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html, body{ height:100%; }
  body{
    font-family:'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    background:radial-gradient(circle at 20% 10%, #0d1626 0%, #060a12 60%, #04060a 100%);
    color:var(--text);
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px;}

  /* ---------- LOGIN ---------- */
  #loginScreen{
    height:100vh; height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .loginBox{
    background:linear-gradient(145deg, var(--panel), var(--panel2));
    border:1px solid var(--border);
    border-radius:16px;
    padding:36px 30px;
    width:100%; max-width:380px;
    box-shadow:0 0 40px rgba(0,229,255,0.08), 0 10px 40px rgba(0,0,0,0.5);
  }
  .loginBox h1{
    text-align:center; font-size:26px; margin-bottom:6px;
    background:linear-gradient(90deg, var(--neon), var(--neon2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .loginBox p.sub{
    text-align:center; color:var(--muted); font-size:13px; margin-bottom:26px;
  }
  .field{ margin-bottom:16px; }
  .field label{
    display:block; font-size:12px; color:var(--muted); margin-bottom:6px;
  }
  .field input{
    width:100%; padding:12px 14px;
    background:#0b1220; border:1px solid var(--border);
    border-radius:10px; color:var(--text); font-size:15px;
    outline:none; transition:0.2s;
  }
  .field input:focus{
    border-color:var(--neon);
    box-shadow:0 0 0 3px rgba(0,229,255,0.15);
  }
  .btnRow{ display:flex; gap:10px; margin-top:22px; }
  button{ cursor:pointer; font-family:inherit; border:none; }
  .btnPrimary{
    flex:1; padding:13px; border-radius:10px;
    background:linear-gradient(90deg, var(--neon), var(--neon2));
    color:#04101a; font-weight:700; font-size:15px; transition:0.2s;
  }
  .btnPrimary:hover{filter:brightness(1.1); transform:translateY(-1px);}
  .btnPrimary:disabled{opacity:0.6; cursor:not-allowed; transform:none;}
  .btnGhost{
    flex:1; padding:13px; border-radius:10px;
    background:transparent; border:1px solid var(--border);
    color:var(--text); font-size:15px; transition:0.2s;
  }
  .btnGhost:hover{border-color:var(--neon2); color:var(--neon2);}
  #loginMsg{
    margin-top:14px; text-align:center; font-size:13px;
    min-height:18px; color:var(--danger);
  }

  /* ---------- CHAT ---------- */
  #chatScreen{
    display:none; height:100vh; height:100dvh; flex-direction:column;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 18px;
    background:linear-gradient(90deg, var(--panel), var(--panel2));
    border-bottom:1px solid var(--border);
  }
  header .title{ display:flex; align-items:center; gap:10px; }
  header .title .dot{
    width:10px; height:10px; border-radius:50%;
    background:var(--success); box-shadow:0 0 8px var(--success);
  }
  .headerAvatar{
    width:32px; height:32px; border-radius:50%;
    object-fit:cover; border:1px solid var(--border); background:var(--panel2);
  }
  header h2{
    font-size:17px;
    background:linear-gradient(90deg, var(--neon), var(--neon2));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header .userInfo{
    display:flex; align-items:center; gap:12px;
    font-size:13px; color:var(--muted);
  }
  header .userInfo b{color:var(--neon);}
  .xuBadge{
    background:rgba(0,230,118,0.15); border:1px solid var(--success);
    color:var(--success); padding:4px 10px; border-radius:20px;
    font-size:12px; font-weight:700;
  }
  .logoutBtn{
    padding:7px 14px; border-radius:8px;
    background:transparent; border:1px solid var(--border);
    color:var(--muted); font-size:12px; transition:0.2s;
  }
  .logoutBtn:hover{border-color:var(--danger); color:var(--danger);}

  #messages{
    flex:1; overflow-y:auto; padding:16px;
    display:flex; flex-direction:column; gap:10px;
  }
  .msg{
    max-width:75%; padding:10px 14px; border-radius:14px;
    font-size:14.5px; line-height:1.4; word-wrap:break-word;
    animation:fadeIn 0.2s ease;
  }
  @keyframes fadeIn{
    from{opacity:0; transform:translateY(6px);}
    to{opacity:1; transform:translateY(0);}
  }
  .msg .name{
    font-size:11.5px; font-weight:700; margin-bottom:3px; color:var(--neon2);
  }
  .msg .time{
    font-size:10px; color:var(--muted); margin-top:4px; text-align:right;
  }
  .msg.mine{
    align-self:flex-end;
    background:linear-gradient(135deg, rgba(0,229,255,0.18), rgba(124,77,255,0.18));
    border:1px solid rgba(0,229,255,0.3);
    border-bottom-right-radius:4px;
  }
  .msg.mine .name{display:none;}
  .msg.theirs{
    align-self:flex-start;
    background:var(--panel2); border:1px solid var(--border);
    border-bottom-left-radius:4px;
  }
  .msg.bot{
    align-self:flex-start;
    background:linear-gradient(135deg, rgba(124,77,255,0.2), rgba(0,229,255,0.12));
    border:1px solid rgba(124,77,255,0.4);
    border-bottom-left-radius:4px;
  }
  .msg.bot .name{ color:var(--neon); }
  .msg.system{
    align-self:center; background:transparent;
    color:var(--muted); font-size:12px; font-style:italic;
  }

  #inputBar{
    display:flex; gap:10px; padding:14px 16px;
    background:var(--panel); border-top:1px solid var(--border);
  }
  #msgInput{
    flex:1; padding:13px 16px;
    background:#0b1220; border:1px solid var(--border);
    border-radius:24px; color:var(--text); font-size:15px; outline:none;
  }
  #msgInput:focus{
    border-color:var(--neon);
    box-shadow:0 0 0 3px rgba(0,229,255,0.12);
  }
  #sendBtn{
    width:46px; height:46px; border-radius:50%;
    background:linear-gradient(135deg, var(--neon), var(--neon2));
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0; transition:0.2s;
  }
  #sendBtn:hover{filter:brightness(1.15); transform:scale(1.05);}
  #sendBtn svg{width:20px; height:20px; fill:#04101a;}

  @media(max-width:480px){
    .msg{max-width:85%;}
    header h2{font-size:15px;}
    header .userInfo{font-size:11px;}
  }
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
  <div class="loginBox">
    <h1>💬 Chat Chung</h1>
    <p class="sub">Đăng nhập để tham gia phòng chat + chơi Nối Từ</p>

    <div class="field">
      <label>Tên đăng nhập</label>
      <input type="text" id="username" placeholder="Nhập tên của bạn" maxlength="20" autocomplete="off">
    </div>
    <div class="field">
      <label>Mật khẩu</label>
      <input type="password" id="password" placeholder="Nhập mật khẩu" maxlength="30" autocomplete="off">
    </div>

    <div class="btnRow">
      <button class="btnGhost" id="registerBtn">Đăng ký</button>
      <button class="btnPrimary" id="loginBtn">Đăng nhập</button>
    </div>
    <div id="loginMsg"></div>
  </div>
</div>

<!-- CHAT SCREEN -->
<div id="chatScreen">
  <header>
    <div class="title">
      <span class="dot"></span>
      <img id="headerAvatar" class="headerAvatar" src="" alt="avatar">
      <h2 id="headerName"></h2>
    </div>
    <div class="userInfo">
      <span class="xuBadge" id="xuDisplay">💰 0 xu</span>
      <button class="logoutBtn" id="logoutBtn">Đăng xuất</button>
    </div>
  </header>

  <div id="messages"></div>

  <div id="inputBar">
    <input type="text" id="msgInput" placeholder="Nhập tin nhắn... (gõ /botnt để chơi nối từ)" maxlength="500" autocomplete="off">
    <button id="sendBtn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

  // Build index by first syllable for fast lookup
  const wordSet = new Set(WORD_LIST);
  const byFirst = {};
  WORD_LIST.forEach(w => {
    const first = w.split(' ')[0];
    if (!byFirst[first]) byFirst[first] = [];
    byFirst[first].push(w);
  });

  // Game state (client-side, per user session)
  let game = null; // { lastWord, used: Set, timer, startTs, chain: number }

  const BOT_NAME = '🤖 Bot Nối Từ';
  const TIME_LIMIT = 15000; // 15 giây

  function normalize(str) {
    return str.trim().toLowerCase().replace(/\s+/g, ' ');
  }

  function getLastSyllable(word) {
    const parts = normalize(word).split(' ');
    return parts[parts.length - 1];
  }

  function pickRandomWord(excludeSet) {
    const candidates = WORD_LIST.filter(w => !excludeSet.has(w));
    if (candidates.length === 0) return null;
    return candidates[Math.floor(Math.random() * candidates.length)];
  }

  function pickNextWord(lastSyllable, used) {
    const list = (byFirst[lastSyllable] || []).filter(w => !used.has(w));
    if (list.length === 0) return null;
    return list[Math.floor(Math.random() * list.length)];
  }

  function postBot(text) {
    messagesRef.push({
      type: 'chat',
      sender: BOT_NAME,
      text: text,
      time: Date.now()
    });
  }

  function postSystem(text) {
    messagesRef.push({
      type: 'system',
      text: text,
      time: Date.now()
    });
  }

  function clearGameTimer() {
    if (game && game.timer) {
      clearTimeout(game.timer);
      game.timer = null;
    }
  }

  function endGame(reason) {
    clearGameTimer();
    if (game) {
      postBot(`⏹️ Hết game! ${reason}\nChuỗi nối được: ${game.chain} từ.\nGõ /botnt để chơi lại.`);
    }
    game = null;
  }

  function startTimer() {
    clearGameTimer();
    if (!game) return;
    game.startTs = Date.now();
    game.timer = setTimeout(() => {
      if (game) {
        endGame('Hết giờ 15 giây! Bạn đã thua.');
      }
    }, TIME_LIMIT);
  }

  function startBotGame() {
    if (game) {
      postBot('⚠️ Bạn đang chơi rồi. Hãy nối từ hiện tại hoặc đợi hết giờ.');
      return;
    }
    const used = new Set();
    const first = pickRandomWord(used);
    if (!first) {
      postBot('Lỗi: không tìm được từ để bắt đầu.');
      return;
    }
    used.add(first);
    game = {
      lastWord: first,
      used: used,
      timer: null,
      startTs: Date.now(),
      chain: 1
    };
    postBot(`🎮 Bắt đầu Nối Từ!\nTừ của bot: 「${first}」\nHãy nối trong 15 giây (từ bắt đầu bằng 「${getLastSyllable(first)}」).\nTrả lời đúng + nhanh → +5 xu!`);
    startTimer();
  }

  async function handlePlayerWord(rawText) {
    if (!game || !myName) return false;
    const text = normalize(rawText);
    // Must be two syllables roughly
    if (!text.includes(' ') || text.split(' ').length !== 2) {
      postBot(`❌ Từ phải là từ ghép 2 tiếng. Ví dụ: "học sinh"`);
      return true; // consumed
    }
    if (!wordSet.has(text)) {
      postBot(`❌ Từ 「${text}」 không có trong từ điển bot. Thử từ khác!`);
      return true;
    }
    if (game.used.has(text)) {
      postBot(`❌ Từ 「${text}」 đã dùng rồi. Không được lặp!`);
      return true;
    }
    const expected = getLastSyllable(game.lastWord);
    const actualFirst = text.split(' ')[0];
    if (actualFirst !== expected) {
      postBot(`❌ Sai! Cần bắt đầu bằng 「${expected}」 (từ bot là 「${game.lastWord}」)`);
      return true;
    }
    // Valid!
    const elapsed = Date.now() - game.startTs;
    clearGameTimer();
    game.used.add(text);
    game.chain++;
    game.lastWord = text;

    // +5 xu
    myXu += 5;
    updateXuDisplay();
    await saveXu();

    postBot(`✅ Đúng rồi! (+5 xu) ⏱️ ${Math.round(elapsed/1000)}s\nTổng xu: ${myXu}\nChuỗi: ${game.chain}`);

    // Bot continues
    const next = pickNextWord(getLastSyllable(text), game.used);
    if (!next) {
      endGame('Bot hết từ để nối! Bạn thắng rồi 🎉');
      return true;
    }
    game.used.add(next);
    game.chain++;
    game.lastWord = next;
    postBot(`Bot nối: 「${next}」\nBạn nối tiếp trong 15 giây (bắt đầu bằng 「${getLastSyllable(next)}」)`);
    startTimer();
    return true;
  }

  async function saveXu() {
    if (!myName) return;
    const key = toKey(myName);
    try {
      await usersRef.child(key).update({ xu: myXu });
    } catch (e) {
      console.error('Save xu failed', e);
    }
  }

  function updateXuDisplay() {
    xuDisplay.textContent = `💰 ${myXu} xu`;
  }

  // ========== AUTH & CHAT ==========
  function showMsg(text, isError=true){
    loginMsg.style.color = isError ? 'var(--danger)' : 'var(--success)';
    loginMsg.textContent = text;
  }

  function setLoading(loading){
    loginBtn.disabled = loading;
    registerBtn.disabled = loading;
  }

  function toKey(name){
    return name.trim().toLowerCase().replace(/[.#$\[\]\/]/g, '_');
  }

  async function register(){
    const name = usernameInput.value.trim();
    const pass = passwordInput.value;
    if(!name || !pass){ showMsg('Vui lòng nhập đầy đủ tên và mật khẩu'); return; }
    if(name.length < 2){ showMsg('Tên đăng nhập quá ngắn'); return; }
    if(pass.length < 3){ showMsg('Mật khẩu phải từ 3 ký tự trở lên'); return; }

    setLoading(true);
    const key = toKey(name);
    try{
      const snap = await usersRef.child(key).get();
      if(snap.exists()){
        showMsg('Tên đăng nhập đã tồn tại, vui lòng đăng nhập');
        setLoading(false);
        return;
      }
      await usersRef.child(key).set({
        displayName: name,
        password: pass,
        xu: 0,
        createdAt: Date.now()
      });
      showMsg('Đăng ký thành công! Đang đăng nhập...', false);
      loginSuccess(name, 0);
    }catch(e){
      showMsg('Lỗi: ' + e.message);
      setLoading(false);
    }
  }

  async function login(){
    const name = usernameInput.value.trim();
    const pass = passwordInput.value;
    if(!name || !pass){ showMsg('Vui lòng nhập đầy đủ tên và mật khẩu'); return; }

    setLoading(true);
    const key = toKey(name);
    try{
      const snap = await usersRef.child(key).get();
      if(!snap.exists()){
        showMsg('Tài khoản chưa tồn tại, hãy bấm Đăng ký');
        setLoading(false);
        return;
      }
      const data = snap.val();
      if(data.password !== pass){
        showMsg('Sai mật khẩu');
        setLoading(false);
        return;
      }
      loginSuccess(data.displayName, data.xu || 0);
    }catch(e){
      showMsg('Lỗi: ' + e.message);
      setLoading(false);
    }
  }

  function loginSuccess(name, xu){
    myName = name;
    myXu = xu || 0;
    localStorage.setItem(LS_KEY, name);
    enterChat();
  }

  function enterChat(){
    loginScreen.style.display = 'none';
    chatScreen.style.display = 'flex';
    document.getElementById('headerName').textContent = myName;
    document.getElementById('headerAvatar').src = 'https://api.dicebear.com/7.x/initials/svg?seed=' + encodeURIComponent(myName);
    updateXuDisplay();
    listenMessages();
  }

  function logout(){
    clearGameTimer();
    game = null;
    localStorage.removeItem(LS_KEY);
    myName = null;
    myXu = 0;
    messagesRef.off();
    messagesDiv.innerHTML = '';
    chatScreen.style.display = 'none';
    loginScreen.style.display = 'flex';
    usernameInput.value = '';
    passwordInput.value = '';
    loginMsg.textContent = '';
  }

  function formatTime(ts){
    const d = new Date(ts);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function listenMessages(){
    messagesDiv.innerHTML = '';
    messagesRef.limitToLast(100).on('child_added', (snap) => {
      const m = snap.val();
      renderMessage(m);
      scrollToBottom();
    });
  }

  function renderMessage(m){
    const div = document.createElement('div');
    if(m.type === 'system'){
      div.className = 'msg system';
      div.textContent = m.text;
    } else {
      const isMine = m.sender === myName;
      const isBot = m.sender === BOT_NAME;
      div.className = 'msg ' + (isMine ? 'mine' : (isBot ? 'bot' : 'theirs'));
      div.innerHTML =
        '<div class="name">' + escapeHtml(m.sender) + '</div>' +
        '<div class="text">' + escapeHtml(m.text).replace(/\n/g, '<br>') + '</div>' +
        '<div class="time">' + formatTime(m.time) + '</div>';
    }
    messagesDiv.appendChild(div);
  }

  function scrollToBottom(){
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  async function sendMessage(){
    const text = msgInput.value.trim();
    if(!text || !myName) return;

    // Command /botnt
    if (text.toLowerCase() === '/botnt' || text.toLowerCase() === '/botnt ') {
      msgInput.value = '';
      // Also push the command as user message so others see
      messagesRef.push({
        type: 'chat',
        sender: myName,
        text: text,
        time: Date.now()
      });
      startBotGame();
      return;
    }

    // If in game, try to treat as answer first
    if (game) {
      const handled = await handlePlayerWord(text);
      if (handled) {
        // Still post the user's word so chat history is complete
        messagesRef.push({
          type: 'chat',
          sender: myName,
          text: text,
          time: Date.now()
        });
        msgInput.value = '';
        return;
      }
    }

    // Normal message
    messagesRef.push({
      type: 'chat',
      sender: myName,
      text: text,
      time: Date.now()
    });
    msgInput.value = '';
  }

  // Events
  loginBtn.addEventListener('click', login);
  registerBtn.addEventListener('click', register);
  logoutBtn.addEventListener('click', logout);
  sendBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') sendMessage();
  });
  passwordInput.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') login();
  });

  // Auto login
  window.addEventListener('DOMContentLoaded', async () => {
    const saved = localStorage.getItem(LS_KEY);
    if(saved){
      const key = toKey(saved);
      try{
        const snap = await usersRef.child(key).get();
        if(snap.exists()){
          const data = snap.val();
          myName = data.displayName;
          myXu = data.xu || 0;
          enterChat();
        } else {
          localStorage.removeItem(LS_KEY);
        }
      }catch(e){
        console.error(e);
      }
    }
  });
</script>
</body>
</html>
